name: Release DMG

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的版本标签，须与 App 版本一致，例如 v0.1.41'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      LINGCHONGDAO_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      commit: ${{ steps.metadata.outputs.commit }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, same pin as ClearZip
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate tag and build host
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(uname -m)" == arm64 ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          swift --version

      - name: Build application and companion plugins
        run: |
          python3 scripts/verify-public-source.py
          ./scripts/build-app.sh release

      - name: Verify application version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'dist/build.noindex/灵宠岛.app/Contents/Info.plist')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo '::error::标签与 App 版本不一致，请先更新 build-app.sh 中的版本。'
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run isolated verification sequentially
        env:
          LINGCHONGDAO_VERIFY_TIMING: report
        run: ./scripts/verify-all.sh

      - name: Preserve published compatible update history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          stable_count=$(gh api "repos/$GH_REPO/releases" --paginate --jq '[.[] | select(.draft == false and .prerelease == false)] | length' | awk '{n += $1} END {print n}')
          if [[ "$stable_count" -gt 0 ]]; then
            gh api "repos/$GH_REPO/releases/latest" > "$RUNNER_TEMP/previous-release.json"
            python3 - "$RUNNER_TEMP/previous-release.json" "$RELEASE_TAG" <<'PY'
          import json, re, sys
          previous = json.load(open(sys.argv[1]))['tag_name']
          current = sys.argv[2]
          def version(tag):
              if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
                  sys.exit('正式发布标签格式不正确。')
              return tuple(map(int, tag[1:].split('.')))
          if version(current) <= version(previous):
              sys.exit('正式版必须高于当前 latest 版本。')
          PY
            if jq -e '.assets | any(.name == "appcast.xml")' "$RUNNER_TEMP/previous-release.json" > /dev/null; then
              previous_tag=$(jq -r '.tag_name' "$RUNNER_TEMP/previous-release.json")
              gh release download "$previous_tag" --pattern appcast.xml --dir "$RUNNER_TEMP"
            else
              python3 - "$RUNNER_TEMP/previous-release.json" <<'PY'
          import json, sys
          tag = json.load(open(sys.argv[1]))['tag_name']
          if tuple(map(int, tag[1:].split('.'))) > (0, 1, 42):
              sys.exit('当前正式版缺少 appcast.xml；拒绝丢弃已发布更新历史。')
          PY
            fi
          fi

      - name: Package and sign DMG and update metadata
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/appcast.xml" ]]; then
            export LINGCHONGDAO_PREVIOUS_APPCAST="$RUNNER_TEMP/appcast.xml"
          fi
          ./scripts/package-dmg.sh --no-build

      - name: Include release notes
        run: cp docs/RELEASE-NOTES.md dist/release/release-notes.md

      - name: Upload checked release assets
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/release/LingChongDao-*.dmg
            dist/release/SHA256SUMS.txt
            dist/release/appcast.xml
            dist/release/release-notes.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
      RELEASE_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate build artifact reference
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]

      - name: Download the checked build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ env.RELEASE_ARTIFACT_ID }}
          merge-multiple: true
          digest-mismatch: error
          path: release

      - name: Verify download integrity
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish without replacing an existing version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          actual_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
          [[ "$actual_commit" == "$RELEASE_COMMIT" ]]
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo '::error::该版本已存在，不会覆盖已发布的安装包。'
            exit 1
          fi
          version=${RELEASE_TAG#v}
          gh release create "$RELEASE_TAG" \
            "release/LingChongDao-$version-macOS-arm64.dmg" release/SHA256SUMS.txt release/appcast.xml \
            --verify-tag --title "灵宠岛 $version" \
            --notes-file release/release-notes.md --draft
          assets=$(gh release view "$RELEASE_TAG" --json assets)
          for expected in "LingChongDao-$version-macOS-arm64.dmg" SHA256SUMS.txt appcast.xml; do
            jq -e --arg name "$expected" '.assets | any(.name == $name and .size > 0)' <<< "$assets" > /dev/null
          done
          gh release edit "$RELEASE_TAG" --draft=false --latest=true
