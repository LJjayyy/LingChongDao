name: Release DMG

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的版本标签，须与 App 版本一致，例如 v0.1.40'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      commit: ${{ steps.metadata.outputs.commit }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, same pin as ClearZip
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate tag and build host
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(uname -m)" == arm64 ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          swift --version

      - name: Build application and companion plugins
        run: |
          python3 scripts/verify-public-source.py
          ./scripts/build-app.sh release

      - name: Verify application version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'dist/build.noindex/灵宠岛.app/Contents/Info.plist')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo '::error::标签与 App 版本不一致，请先更新 build-app.sh 中的版本。'
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run isolated verification sequentially
        run: ./scripts/verify-all.sh

      - name: Package DMG and checksum
        run: ./scripts/package-dmg.sh --no-build

      - name: Include release notes
        run: cp docs/RELEASE-NOTES.md dist/release/release-notes.md

      - name: Upload checked release assets
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
      RELEASE_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate build artifact reference
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]

      - name: Download the checked build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ env.RELEASE_ARTIFACT_ID }}
          merge-multiple: true
          digest-mismatch: error
          path: release

      - name: Verify download integrity
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish without replacing an existing version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          actual_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
          [[ "$actual_commit" == "$RELEASE_COMMIT" ]]
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo '::error::该版本已存在，不会覆盖已发布的安装包。'
            exit 1
          fi
          version=${RELEASE_TAG#v}
          gh release create "$RELEASE_TAG" \
            "release/LingChongDao-$version-macOS-arm64.dmg" release/SHA256SUMS.txt \
            --verify-tag --title "灵宠岛 $version" \
            --notes-file release/release-notes.md --latest=true
