name: macOS build and verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check public source and build host
        run: |
          test "$(uname -m)" = arm64
          python3 scripts/verify-public-source.py

      - name: Build application with an ephemeral verification key
        env:
          LINGCHONGDAO_UPDATE_TESTING: '1'
        run: |
          swift Tests/UpdateReleaseVerification/generate-test-key.swift "$RUNNER_TEMP/update-test-key.json"
          export LINGCHONGDAO_SPARKLE_PUBLIC_KEY=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["public"])' "$RUNNER_TEMP/update-test-key.json")
          ./scripts/build-app.sh release

      - name: Run isolated verification sequentially
        env:
          LINGCHONGDAO_VERIFY_TIMING: report
        run: ./scripts/verify-all.sh

      - name: Verify signed packaging without distributing test builds
        run: |
          export SPARKLE_PRIVATE_KEY=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["private"])' "$RUNNER_TEMP/update-test-key.json")
          ./scripts/package-dmg.sh --no-build
          (cd dist/release && shasum -a 256 -c SHA256SUMS.txt)

      - name: Remove ephemeral verification key
        if: always()
        run: rm -f "$RUNNER_TEMP/update-test-key.json"
