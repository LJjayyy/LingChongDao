name: macOS build and verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check public source and build host
        run: |
          test "$(uname -m)" = arm64
          python3 scripts/verify-public-source.py

      - name: Build public application and plugins
        run: ./scripts/build-app.sh release

      - name: Run isolated verification sequentially
        run: ./scripts/verify-all.sh

      - name: Package DMG
        run: ./scripts/package-dmg.sh --no-build

      - name: Upload development DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LingChongDao-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/release/LingChongDao-*.dmg
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
